```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Андрея ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#0f0f0f;
    font-family:Arial,sans-serif;
    height:100vh;
}

/* Фон */

.background{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%, rgba(255,0,100,.35), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,50,150,.3), transparent 30%),
    radial-gradient(circle at 50% 90%, rgba(255,0,200,.2), transparent 40%),
    #090909;
    animation:bgMove 12s infinite alternate ease-in-out;
}

@keyframes bgMove{
    from{transform:scale(1);}
    to{transform:scale(1.15);}
}

/* Экран входа */

.enter{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(20px);
    background:rgba(0,0,0,.45);
    z-index:100;
    cursor:pointer;
    transition:1s;
}

.enter button{
    border:none;
    padding:20px 50px;
    border-radius:50px;
    font-size:22px;
    color:white;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(255,0,120,.4);
    cursor:pointer;
    transition:.3s;
}

.enter button:hover{
    transform:scale(1.08);
}

/* Контент */

.content{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    opacity:0;
    transition:2s;
}

.title{
    font-size:clamp(40px,8vw,90px);
    text-align:center;
    color:white;
    text-shadow:
    0 0 20px #ff4da6,
    0 0 40px #ff4da6;
    animation:float 4s ease-in-out infinite;
}

.subtitle{
    margin-top:20px;
    color:#ffd1e6;
    font-size:22px;
    opacity:.9;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

/* Сердечки */

.heart{
    position:absolute;
    color:#ff4da6;
    font-size:20px;
    pointer-events:none;
    animation:rise linear forwards;
}

@keyframes rise{
    from{
        transform:translateY(0) scale(0.5);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(1.8);
        opacity:0;
    }
}

/* Светящиеся круги */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
}

.g1{
    width:300px;
    height:300px;
    background:#ff0077;
    left:10%;
    top:20%;
}

.g2{
    width:250px;
    height:250px;
    background:#ff4da6;
    right:15%;
    bottom:15%;
}
</style>
</head>
<body>

<div class="background"></div>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="enter" id="enter">
    <button>Нажми ❤️</button>
</div>

<div class="content" id="content">
    <div class="title">
        Я люблю тебя,<br>
        Андрей ❤️
    </div>

    <div class="subtitle">
        Ты самый важный человек ✨
    </div>
</div>

<script>

const enter = document.getElementById("enter");
const content = document.getElementById("content");

enter.addEventListener("click",()=>{

    enter.style.opacity="0";

    setTimeout(()=>{
        enter.style.display="none";
        content.style.opacity="1";
    },1000);

    createHearts();

});

function createHearts(){

    setInterval(()=>{

        const heart = document.createElement("div");

        heart.className = "heart";
        heart.innerHTML = "❤️";

        heart.style.left = Math.random()*100+"vw";
        heart.style.bottom = "-30px";

        heart.style.fontSize =
        (15 + Math.random()*40)+"px";

        heart.style.animationDuration =
        (4 + Math.random()*4)+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },8000);

    },150);

}

</script>

</body>
</html>
